[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-rl"
version = "0.1.0"
description = "Reinforcement learning agents for Pokémon Emerald using BizHawk"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "gymnasium",
    "stable-baselines3",
    "numpy",
    "opencv-python",
    "torch",
    "wandb",
    "supersuit"
]

[tool.setuptools]
packages = ["env"]