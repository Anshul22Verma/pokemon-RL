[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-rl"
version = "0.1.0"
description = "Pokemon reinforcement learning experiments"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "mgba",
    "gymnasium",
    "stable-baselines3",
    "opencv-python",
    "numpy",
    "torch",
    "wandb",
    "supersuit"
]

[tool.setuptools]
packages = ["envs"]